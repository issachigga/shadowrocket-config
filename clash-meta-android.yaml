rules:
  # Dedicated DNS transport routes; respect-rules handles domestic bootstrap.
  - IP-CIDR,223.5.5.5/32,DIRECT,no-resolve
  - IP-CIDR,1.12.12.12/32,DIRECT,no-resolve
  - IP-CIDR,1.1.1.1/32,🚀 节点选择,no-resolve
  - IP-CIDR,1.0.0.1/32,🚀 节点选择,no-resolve
  - IP-CIDR,8.8.8.8/32,🚀 节点选择,no-resolve
  - DOMAIN-WILDCARD,*.ccb.com,DIRECT
  - DOMAIN-WILDCARD,*.abchina.com.cn,DIRECT
  - DOMAIN-WILDCARD,*.psbc.com,DIRECT
  - DOMAIN,www.baidu.com,DIRECT
  - RULE-SET,Lan,DIRECT
  - RULE-SET,Apple,苹果服务
  - RULE-SET,Google,谷歌服务
  - RULE-SET,Telegram,Telegram
  - RULE-SET,OpenAI,ChatGPT
  - RULE-SET,Copilot,Copilot
  - RULE-SET,GitHub,GitHub
  - RULE-SET,Microsoft,微软服务
  - RULE-SET,XiaoMi,小米服务
  - RULE-SET,NetEaseMusic,国内媒体
  - RULE-SET,Steam,Steam
  - RULE-SET,TikTok,TikTok
  - RULE-SET,YouTube,YouTube
  - RULE-SET,Netflix,Netflix
  - RULE-SET,Disney,Disney+
  - RULE-SET,Spotify,Spotify
  - RULE-SET,Bahamut,Bahamut
  - RULE-SET,ChinaMedia,国内媒体
  - RULE-SET,GlobalMedia,国外媒体
  - RULE-SET,ChinaMax,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  # QUIC is allowed by default; no blanket UDP/443 rule.
  - MATCH,🚀 节点选择
