# Clash Meta for Android / mihomo - TEST v0.1
# No real nodes or subscriptions. Add your own LOCAL proxies/provider before use.
# This file does NOT merge nodes from other Android profiles.
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: true
profile:
  store-selected: true
  store-fake-ip: true

# CMFA manages Android VPN/TUN. Do not copy desktop auto-route settings here.
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "localhost"
  prefer-h3: false
  respect-rules: true
  default-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  direct-nameserver-follow-policy: false
  nameserver:
    - "https://1.1.1.1/dns-query#🚀 节点选择"
    - "https://1.0.0.1/dns-query#🚀 节点选择"
    - "https://8.8.8.8/dns-query#🚀 节点选择"
  # No system DNS or domestic fallback for default/foreign queries.
  # Local DNS names may need a separate LOCAL override; not included publicly.

# Replace [] with your own Clash-format node list (LOCAL ONLY).
proxies: []
# OR uncomment this entire provider section and replace the placeholder LOCAL ONLY.
# proxy-providers:
#   MySubscription:
#     type: http
#     url: "https://example.invalid/REPLACE_WITH_YOUR_PRIVATE_CLASH_SUBSCRIPTION"
#     path: ./proxy-providers/my-subscription.yaml
#     interval: 86400
#     proxy: DIRECT
#     health-check:
#       enable: false

proxy-groups:
